[package]
name = "glint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
pulldown-cmark = "0.12"
ratatui = "0.29"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "2"
ureq = { version = "2", features = ["json"] }
unicode-width = "0.1"
uuid = { version = "1", default-features = false, features = ["v4"] }
vt100 = { path = "vendor/vt100" }
