[llm]
provider = "deepseek"
model = "deepseek-chat"
temperature = 0.7
max_tokens = 8196

[llm.providers.ftai]
base_url = "https://llm-proxy.ftai.chat/v1"
models = ["deepseek-v4-flash", "deepseek-chat", "gpt-4.1-mini"]
api_key_env = "FTAI_API_KEY"

[llm.providers.deepseek]
base_url = "https://api.deepseek.com"
models = ["deepseek-chat", "deepseek-reasoner"]
api_key_env = "DEEPSEEK_API_KEY"

[llm.providers.volcengine]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
models = ["deepseek-v4-flash", "deepseek-v3-250324", "deepseek-r1-250120"]
api_key_env = "VOLCENGINE_API_KEY"

[llm.providers.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4/"
models = ["glm-4-flash", "glm-4-plus"]
api_key_env = "ZHIPU_API_KEY"

[llm.providers.kimi]
base_url = "https://api.moonshot.ai/v1/"
models = ["moonshot-v1-8k", "moonshot-v1-32k", "moonshot-v1-128k"]
api_key_env = "KIMI_API_KEY"

[llm.providers.dashscope]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
models = ["qwen-plus", "qwen-turbo", "qwen-max"]
api_key_env = "DASHSCOPE_API_KEY"

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
models = ["deepseek/deepseek-chat", "openai/gpt-4.1-mini", "anthropic/claude-3.5-sonnet"]
api_key_env = "OPENROUTER_API_KEY"
