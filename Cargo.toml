[package]
name = "glint"
version = "0.1.0"
edition = "2024"
description = "A terminal coding agent for OpenAI-compatible LLM endpoints"
repository = "https://github.com/xhhwyh/glint"
homepage = "https://github.com/xhhwyh/glint"
readme = "README.md"
keywords = ["tui", "llm", "coding-agent", "terminal", "openai-compatible"]
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
http = "1"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
libc = "0.2"
pulldown-cmark = "0.12"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
rmcp = { version = "1.8", default-features = false, features = [
    "auth",
    "base64",
    "client",
    "elicitation",
    "macros",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "2"
tokio = { version = "1", features = [
    "io-util",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
unicode-width = "0.1"
uuid = { version = "1", default-features = false, features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
